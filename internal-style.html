<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Internal Style</title>
        <style>
            h1 {
                color: green;
            }
            p {
                color: purple;
            }
        </style>
    </head>
    <body>
        <h1>Tiêu đề với Internal Style</h1>
        <p>
            Đây là đoạn văn được định dạng màu sắc bằng <b>internal-style</b>.
            CSS được viết trong thẻ &lt;style&gt; đặt bên trong phần &lt;head&gt;.
        </p>
    </body>
</html>
